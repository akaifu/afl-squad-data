name: Update AFL draft order

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours; trade period moves fast. Lower it outside Oct-Nov if you like.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: afl-data-commit
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scrape Zero Hanger draft order
        run: python scrape_draft_order.py
      - name: Commit if changed
        run: |
          git config user.name "afl-squad-bot"
          git config user.email "actions@github.com"
          git add draft_order.json
          git diff --staged --quiet || git commit -m "Update draft order [automated]"
          git pull --rebase
          git push
