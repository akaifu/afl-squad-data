<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 AFL Draft Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#0d1117;color:#e6edf3;min-height:100vh;font-size:14px}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── topbar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;border-bottom:1px solid #21262d;background:#11161d;flex-shrink:0;gap:12px}
.topbar h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar h1 .ico{color:#d4a800}
.pick-ticker{display:flex;align-items:center;gap:8px;font-size:13px}
.pick-ticker .lbl{color:#9aa4b2}
.pick-ticker .val{font-weight:700;font-size:15px;color:#d4a800}
.pick-ticker .club-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.topbar-actions{display:flex;gap:8px}
.btn{padding:7px 14px;font-size:13px;font-weight:600;border-radius:7px;border:1px solid #30363d;cursor:pointer;background:#21262d;color:#c9d1d9;white-space:nowrap}
.btn:hover{background:#2d333b;color:#fff}
.btn.gold{background:#d4a800;color:#1a1100;border:none}
.btn.gold:hover{filter:brightness(1.08)}
.btn.red{background:#f85149;color:#1a0a0a;border:none}
.btn.red:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ── main layout: 3 columns ── */
.cols{display:flex;flex:1;overflow:hidden;gap:1px;background:#21262d}

/* ── left: draft board ── */
.board-col{width:420px;flex-shrink:0;display:flex;flex-direction:column;background:#0d1117;overflow:hidden}
.col-head{padding:11px 14px;border-bottom:1px solid #21262d;background:#11161d;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9aa4b2;display:flex;justify-content:space-between;align-items:center}
.board-list{flex:1;overflow-y:auto}
.pick-row{display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid #161b22;font-size:13px;cursor:default}
.pick-row.current{background:#1c2d1c;border-left:3px solid #3fb950}
.pick-row.done{opacity:.55}
.pick-row .pnum{font-family:monospace;width:30px;font-size:11px;color:#9aa4b2;flex-shrink:0}
.pick-row .pround{font-size:10px;color:#7d8590;width:16px;text-align:center;flex-shrink:0}
.pick-row .pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pick-row .pclub{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-row .porigin{font-size:10.5px;color:#7d8590;flex:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-row .pselected{font-weight:600;color:#3fb950;font-size:12.5px;flex:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── middle: prospect list ── */
.prospects-col{flex:1;display:flex;flex-direction:column;background:#0d1117;overflow:hidden;min-width:360px}
.search-bar{padding:8px 12px;border-bottom:1px solid #21262d;display:flex;gap:8px}
.search-bar input{flex:1;padding:6px 10px;font-size:13px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#e6edf3}
.search-bar select{padding:6px 8px;font-size:12px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#e6edf3;cursor:pointer}
.prospect-list{flex:1;overflow-y:auto}
.prospect-row{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid #161b22;cursor:pointer;font-size:13px}
.prospect-row:hover{background:#161b22}
.prospect-row.selected-pick{background:#132a1c}
.prospect-row.drafted{opacity:.3;cursor:not-allowed}
.prospect-row .prank{font-family:monospace;font-size:11px;color:#9aa4b2;width:26px;text-align:right;flex-shrink:0}
.prospect-row .pname{font-weight:600;flex:1;min-width:0}
.prospect-row .ppos{font-size:11px;color:#9aa4b2;width:80px;flex-shrink:0}
.prospect-row .pstate{font-size:11px;color:#7d8590;width:32px;flex-shrink:0}
.prospect-row .page{font-size:11px;color:#7d8590;width:20px;text-align:right;flex-shrink:0}
.prospect-row .ptie{font-size:10px;padding:1px 6px;border-radius:8px;background:#3d2a04;color:#d29922;flex-shrink:0}
.prospect-row.selected-pick .pname{color:#56e088}

/* ── right: club selections panel ── */
.clubs-col{width:340px;flex-shrink:0;display:flex;flex-direction:column;background:#0d1117;overflow:hidden}
.club-tab-list{flex:1;overflow-y:auto}
.club-section{border-bottom:1px solid #21262d}
.club-section-head{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;background:#11161d}
.club-section-head:hover{background:#1c2128}
.club-section-head .cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.club-section-head .cnm{font-weight:600;font-size:13px;flex:1}
.club-section-head .cpick-count{font-size:11px;color:#9aa4b2}
.club-picks{padding:4px 12px 8px 28px}
.club-pick-item{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12.5px}
.club-pick-item .cpi-num{color:#9aa4b2;font-size:11px;width:34px;flex-shrink:0}
.club-pick-item .cpi-name{flex:1;font-weight:500}
.club-pick-item .cpi-pos{font-size:10.5px;color:#9aa4b2;width:65px;flex-shrink:0}

/* ── draft complete banner ── */
.complete-banner{display:none;padding:14px 20px;background:#0d3d2a;border-bottom:2px solid #2ea043;font-size:14px;font-weight:700;color:#56e088;text-align:center;flex-shrink:0}

/* ── prospect detail tooltip/preview ── */
.preview{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin:8px 12px;font-size:12.5px;flex-shrink:0}
.preview .plbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#9aa4b2;font-weight:700;margin-bottom:2px}
.preview .pval{color:#e6edf3;margin-bottom:7px}
.preview .pval.name{font-size:16px;font-weight:700;color:#fff;margin-bottom:3px}
.preview .tie-badge{display:inline-block;padding:2px 8px;border-radius:10px;background:#3d2a04;color:#d29922;font-size:11px;font-weight:600}

@media (max-width:1100px){
  .board-col{width:320px}
  .clubs-col{width:280px}
}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}
.modal{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:18px;max-width:760px;width:94%;max-height:86vh;overflow:auto;font-size:13px;color:#e6edf3}
.modal h2{font-size:16px;margin-bottom:8px}.modal p,.modal li{color:#9aa4b2;line-height:1.5;margin:4px 0}
.modal table{width:100%;border-collapse:collapse;margin:8px 0}.modal th,.modal td{padding:4px 8px;border-bottom:1px solid #21262d;text-align:right}
.modal th:first-child,.modal td:first-child{text-align:left}.modal th{color:#9aa4b2;font-size:11px;text-transform:uppercase;position:sticky;top:0;background:#161b22}
.modal .gold{background:#d4a800;color:#1a1100;border-color:#d4a800;font-weight:700}.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}.modal .bad{color:#f85149}.modal .ok{color:#3fb950}
</style>
</head>

      <button class="btn red" onclick="resetDraft()">↺ Reset draft</button>
      <a class="btn gold" href="afl_list_tool.html" style="text-decoration:none">← List room</a>
    </div>
  </div>

  <div class="complete-banner" id="complete-banner">
    🏆 Draft complete! All picks have been made.
  </div>

  <div class="cols">

    <!-- left: draft board -->
    <div class="board-col">

    <div class="prospects-col">

      <div class="search-bar">

          <option value="MID">MID</option>
          <option value="FWD">FWD</option>
          <option value="DEF">DEF</option>
          <option value="RUC">RUC</option>
          <option value="KEY">Key</option>
        </select>
        <select id="pstate-filter" onchange="renderProspects()">

          <option value="VIC">VIC</option>
          <option value="SA">SA</option>
          <option value="WA">WA</option>
          <option value="QLD">QLD</option>
          <option value="TAS">TAS</option>
        </select>
      </div>
      <div id="prospect-preview" class="preview" style="display:none"></div>
      <div class="prospect-list" id="prospect-list"></div>
    </div>

    <!-- right: club selections -->
    <div class="clubs-col">
      <div class="col-head">Club selections</div>
      <div class="club-tab-list" id="club-tab-list"></div>
    </div>

  </div>
</div>

// ─── STATE ────────────────────────────────────────────────────────────────
// selections[i] = prospect selected for DRAFT_ORDER[i], or null
let selections = new Array(DRAFT_ORDER.length).fill(null);
let currentPick = 0; // index into DRAFT_ORDER
let previewProspect = null;

function isDrafted(prospectRank){
  return selections.some(s=>s&&s.rank===prospectRank);
}
function draftedBy(prospectRank){
  const idx=selections.findIndex(s=>s&&s.rank===prospectRank);
  if(idx<0)return null;
  return gc(DRAFT_ORDER[idx].club);
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────
function selectProspect(rank){
  if(currentPick>=DRAFT_ORDER.length)return;
  const p=PROSPECTS.find(x=>x.rank===rank);
  if(!p||isDrafted(rank))return;
  const d=DRAFT_ORDER[currentPick];
  if(p.tie&&p.tie!==d.club){showBid(p);return;} // rival bid on a concession player
  snap();selections[currentPick]=p;advance();commit();
}

function undoLastPick(){
  if(!undoStack.length)return;
  const s=JSON.parse(undoStack.pop());
  DRAFT_ORDER=s.o;selections=s.s;currentPick=s.c;deficits=s.d;log=s.l;compDone=s.k;
  renderAll();
}

function autoPickAll(){
  // Best available each pick; bids on club-tied players are matched automatically when the rules allow it
  snap();
  let guard=500;
  while(currentPick<DRAFT_ORDER.length&&guard--){
    const d=DRAFT_ORDER[currentPick];
    const p=PROSPECTS.filter(x=>!isDrafted(x.rank)).sort((a,b)=>a.rank-b.rank)[0];
    if(!p)break;
    if(p.tie&&p.tie!==d.club){const plan=planMatch(p.tie,currentPick);if(plan.ok){applyMatch(p,plan);checkComp();continue;}}
    selections[currentPick]=p;advance();checkComp();
  }
  commit();
}

function resetDraft(){
  if(!confirm('Reset the entire draft? All picks, matched bids and compensation picks will be cleared.'))return;
  DRAFT_ORDER=JSON.parse(JSON.stringify(BASE_ORDER));selections=DRAFT_ORDER.map(()=>null);
  currentPick=0;previewProspect=null;undoStack=[];log=[];deficits={};compDone=false;
  renderAll();
}

function previewP(rank){
  previewProspect=PROSPECTS.find(x=>x.rank===rank)||null;

// ─── LIVE DRAFT ORDER (Zero Hanger, via scrape_draft_order.py -> draft_order.json) ───
const LIVE_ORDER_URL='https://raw.githubusercontent.com/akaifu/afl-squad-data/main/draft_order.json';
function applyOrder(json){
  const known=new Set(CLUBS.map(c=>c.id));
  const next=json.picks.filter(p=>p.pick<=PROSPECTS.length&&known.has(p.club)).map(function(p){
    const rl=p.roundLabel||p.round;
    return {pick:p.pick,round:p.round,roundLabel:p.roundLabel,club:p.club,
      origin:p.from&&p.from!==p.club?gc(p.from).short+' R'+rl+' \u2014 traded':gc(p.club).short+' own R'+rl};
  });
  // keep any picks already made (matched by pick number) if the order changes mid-draft
  const byPick={};
  DRAFT_ORDER.forEach(function(d,i){if(selections[i])byPick[d.pick]=selections[i];});
  DRAFT_ORDER=next;
  selections=next.map(function(d){return byPick[d.pick]||null;});
  currentPick=0;
  while(currentPick<selections.length&&selections[currentPick])currentPick++;
}
async function loadLiveOrder(){
  const st=document.getElementById('order-status');
  try{
    const res=await fetch(LIVE_ORDER_URL,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const json=await res.json();
    if(undoStack.length)return; // draft in progress - keep the order stable
    if(!json.picks||json.picks.length<40)throw new Error('incomplete');
    applyOrder(json);markStart();
    st.textContent='● Live order (Zero Hanger) · '+new Date(json.generatedAt).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
    st.style.color='#3fb950';
  }catch(e){
    st.textContent='● Built-in order, snapshot 19 Oct (live feed unavailable)';
    st.style.color='#d29922';
  }
  renderAll();
}

// ─── DVI + BIDDING (AFL 2026 National Draft rules) ───────────────────────
// Source: afl.com.au "Changes to AFL Player Movement confirmed" + official 2026 Draft Value Index (picks 1-54)
const DVI=[0,3000,2481,2178,1962,1795,1659,1543,1443,1355,1276,1205,1140,1080,1024,973,924,879,836,796,757,721,686,653,621,590,561,533,505,479,454,429,405,382,360,338,317,297,277,257,238,220,202,184,167,150,134,118,102,86,71,57,42,28,14];
const dvi=n=>DVI[n]||0;
const DEFICIT_CAP=412, NEXT_PICK_FROM=37; // 2026 values (2027: pick 39, 19-team DVI to pick 57)
// 2026 finishing positions: grand finalists Brisbane (1st) & Fremantle (2nd); prelim-final losers Sydney & Hawthorn (3rd-4th);
// remaining finalists 5th-10th; everyone else 11th-18th.
const TIER={brisbane:'top2',fremantle:'top2',sydney:'top4',hawthorn:'top4',adelaide:'mid',geelong:'mid',melbourne:'mid',westernbulldogs:'mid',collingwood:'mid',carlton:'mid'};
const BOTTOM5=['essendon','richmond','westcoast','portadelaide','northmelbourne']; // 18th..14th
let undoStack=[],log=[],deficits={},compDone=false,BASE_ORDER=[],pendingBid=null;
function markStart(){DRAFT_ORDER.forEach(function(d){d.start=d.pick;d.own=/own/.test(d.origin);});BASE_ORDER=JSON.parse(JSON.stringify(DRAFT_ORDER));}
function adj(club,bid){const t=TIER[club]||'low';
  if(t==='top2'&&bid<=18)return 1.2; if(t==='top4'&&bid<=18)return 1.1; if(t==='low'&&bid<=36)return 0.9; return 1;}
function snap(){undoStack.push(JSON.stringify({o:DRAFT_ORDER,s:selections,c:currentPick,d:deficits,l:log,k:compDone}));}
function advance(){currentPick++;while(currentPick<DRAFT_ORDER.length&&selections[currentPick])currentPick++;}
function commit(){checkComp();previewProspect=null;renderAll();const r=document.getElementById('pick-row-'+currentPick);if(r)r.scrollIntoView({block:'nearest'});}
function renumber(){DRAFT_ORDER.forEach(function(d,i){d.pick=i+1;});}

function planMatch(club,bi){
  const N=bi+1,nxt=[];
  for(let i=bi+1;i<DRAFT_ORDER.length;i++)if(DRAFT_ORDER[i].club===club&&!selections[i])nxt.push(i);
  if(N>=NEXT_PICK_FROM)return {mode:'next',use:nxt.slice(0,1),req:0,total:0,deficit:0,ok:nxt.length>0};
  const req=Math.round(dvi(N)*adj(club,N));let use=[],total=0;
  for(const i of nxt){if(use.length>=2||total>=req)break;use.push(i);total+=dvi(i+1);} // max two picks
  const deficit=Math.max(0,req-total);
  return {mode:'points',use:use,req:req,total:total,deficit:deficit,ok:(deficits[club]||0)+deficit<=DEFICIT_CAP};
}
function applyMatch(p,plan){
  const bi=currentPick,N=bi+1,club=p.tie;
  if(plan.mode==='next'){ // bid at 37+: matched with the club's next pick, no points
    const i=plan.use[0];selections[i]=p;DRAFT_ORDER[i].origin+=' \u2014 '+p.name+' (matched)';
    log.push('Pick '+N+': '+gc(club).short+' matched bid on '+p.name+' with their next pick (#'+(i+1)+').');return;
  }
  const rounds=DRAFT_ORDER.map(d=>[d.round,d.roundLabel]);
  const items=DRAFT_ORDER.map((d,i)=>({d:d,s:selections[i]}));
  const usedSet=new Set(plan.use),used=plan.use.map(i=>items[i]);
  const list=items.filter((x,i)=>!usedSet.has(i));
  list.splice(bi,0,{d:{club:club,round:DRAFT_ORDER[bi].round,roundLabel:DRAFT_ORDER[bi].roundLabel,origin:'Matched bid #'+N+' \u2014 '+p.name},s:p});
  let partial=null;const left=plan.total-plan.req;
  if(plan.deficit===0&&left>0&&used.length)partial=used[used.length-1];
  if(partial){let pos=list.findIndex((y,i)=>i>bi+1&&dvi(i+1)<=left);if(pos<0)pos=list.length;partial.d.origin+=' (part-used to match)';list.splice(pos,0,partial);}
  DRAFT_ORDER=list.map(function(x,i){x.d.pick=i+1;const r=rounds[Math.min(i,rounds.length-1)];x.d.round=r[0];x.d.roundLabel=r[1];return x.d;});
  selections=list.map(x=>x.s||null);
  currentPick=bi+1; // the bidder's pick slid back one and they pick again
  deficits[club]=(deficits[club]||0)+plan.deficit;
  log.push('Pick '+N+': '+gc(club).short+' matched bid on '+p.name+', sacrificing picks '+plan.use.map(i=>i+1).join(' & ')+' ('+plan.req+' pts'+(plan.deficit?', '+plan.deficit+' pts deficit taken from their 2027 R1':'')+').');
}
function checkComp(){ // compensation pick: bottom-5 club whose own natural R1 pick slid back and was used (decided after night one)
  if(compDone||DRAFT_ORDER.some((d,i)=>d.round===1&&!selections[i]))return;
  compDone=true;let added=0;
  BOTTOM5.forEach(function(club,k){
    const i=DRAFT_ORDER.findIndex(d=>d.club===club&&d.own&&d.start&&DRAFT_ORDER.indexOf(d)>=0&&d.round===1);
    if(i<0||!selections[i]||i+1<=DRAFT_ORDER[i].start)return;
    const r2=DRAFT_ORDER.findIndex(d=>d.round>=2),idx=Math.min((r2<0?DRAFT_ORDER.length:r2)+k+added,DRAFT_ORDER.length);
    DRAFT_ORDER.splice(idx,0,{club:club,round:2,origin:'Compensation \u2014 R1 pick slid',comp:true});selections.splice(idx,0,null);added++;
    log.push(gc(club).short+' awarded a round 2 compensation pick (R1 pick slid from #'+DRAFT_ORDER[i].start+' to #'+(i+1)+').');
  });
  renumber();
}

function openModal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modal-bg').style.display='flex';}
function closeModal(){document.getElementById('modal-bg').style.display='none';pendingBid=null;}
function showBid(p){
  const bi=currentPick,N=bi+1,plan=planMatch(p.tie,bi),c=gc(p.tie),b=gc(DRAFT_ORDER[bi].club);
  pendingBid={p:p,plan:plan};
  let body;
  if(plan.mode==='next'){
    body='<p>Bids at pick '+NEXT_PICK_FROM+' or later are matched with the club\u2019s <b>next pick</b> (no points).</p>'+
      (plan.ok?'<p class="ok">'+c.short+' sacrifice pick '+(plan.use[0]+1)+'.</p>':'<p class="bad">'+c.short+' have no pick left to match with.</p>');
  }else{
    const a=adj(p.tie,N);
    body='<table><tr><th>Item</th><th>Points</th></tr><tr><td>DVI of pick '+N+'</td><td>'+dvi(N)+'</td></tr>'+
      '<tr><td>'+c.short+' ladder adjustment</td><td>'+(a===1?'none':(a>1?'+':'')+Math.round((a-1)*100)+'%')+'</td></tr>'+
      '<tr><td><b>Points to match</b></td><td><b>'+plan.req+'</b></td></tr>'+
      plan.use.map(i=>'<tr><td>Sacrifice pick '+(i+1)+'</td><td>'+dvi(i+1)+'</td></tr>').join('')+
      '<tr><td>Shortfall (taken as draft deficit)</td><td class="'+(plan.deficit?'bad':'ok')+'">'+plan.deficit+'</td></tr></table>'+
      (plan.ok?'':'<p class="bad">Over the '+DEFICIT_CAP+'-point deficit cap ('+(deficits[p.tie]||0)+' already used), so under the 2026 rules '+c.short+' cannot match. You can still force it in this simulator.</p>');
  }
  openModal('<h2>'+c.name+': match or pass?</h2><p><b>'+b.name+'</b> have bid at <b>pick '+N+'</b> for <b>'+p.name+'</b> ('+(p.notes||'')+').</p>'+body+
    '<p>If '+c.short+' match, they take '+p.name+' at pick '+N+' and '+b.short+' are back on the clock at pick '+(N+1)+'. If '+c.short+' pass, '+b.short+' take him.</p>'+
    '<div class="row"><button class="btn" onclick="closeModal()">Cancel</button>'+
    '<button class="btn" onclick="confirmBid(false)">Pass \u2014 '+b.short+' take him</button>'+
    '<button class="btn gold" onclick="confirmBid(true)">'+(plan.ok?'Match bid':'Match anyway')+'</button></div>');
}
function confirmBid(match){
  const b=pendingBid;closeModal();if(!b)return;
  snap();
  if(match)applyMatch(b.p,b.plan);else{selections[currentPick]=b.p;advance();}
  commit();
}
function showDVI(){
  const tiers=[['brisbane','Top 2 (+20%)'],['sydney','3rd\u20134th (+10%)'],['adelaide','5th\u201310th'],['essendon','11th\u201318th (\u221210%)']];
  let rows='';
  for(let n=1;n<=54;n++){
    const d=DRAFT_ORDER[n-1],c=d?gc(d.club):null;
    rows+='<tr><td>'+n+'</td><td>'+(c?c.short:'\u2013')+'</td><td>'+dvi(n)+'</td>'+tiers.map(t=>'<td>'+(n>=NEXT_PICK_FROM?'next pick':Math.round(dvi(n)*adj(t[0],n)))+'</td>').join('')+'</tr>';
  }
  openModal('<h2>2026 Draft Value Index</h2><p>Points per pick (picks 1\u201354; later picks are worth 0), and the points a tied club must pay to match a bid at that pick, by the matching club\u2019s 2026 finishing position. Holder = current owner of that pick number in the live order.</p>'+
    '<table><tr><th>Pick</th><th>Holder</th><th>DVI</th>'+tiers.map(t=>'<th>'+t[1]+'</th>').join('')+'</tr>'+rows+'</table>'+
    '<h2>This draft</h2>'+(log.length?'<ul>'+log.map(l=>'<li>'+l+'</li>').join('')+'</ul>':'<p>No bids matched yet.</p>')+
    '<div class="row"><button class="btn" onclick="closeModal()">Close</button></div>');
